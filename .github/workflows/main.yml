name: Build and Push Python Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to write to the GitHub Container Registry (ghcr.io)

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        # Use ghcr.io for the GitHub Container Registry
        registry: ghcr.io
        # Use the built-in GITHUB_ACTOR (your GitHub username) as the username
        username: ${{ github.actor }}
        # Use the built-in GITHUB_TOKEN for authentication
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        # Define the tags: use the commit SHA and 'latest' for the main branch
        tags: |
          type=sha,format=long
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
