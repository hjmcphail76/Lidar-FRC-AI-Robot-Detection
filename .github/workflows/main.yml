name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ] # Runs automatically every time you push code to your main branch
  workflow_dispatch: # Lets you re-run it manually from the Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necessary to push to GitHub Container Registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sets up QEMU so GitHub can emulate ARM architecture for the Orange Pi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Sets up Docker Buildx for cross-compiling
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log into GitHub Container Registry (GHCR) using the built-in token
      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Automatically extracts metadata and converts the repository name to lowercase
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/sheriff-scanner
          tags: |
            type=raw,value=latest

      # Build the image for ARM64 (Orange Pi) and push it to GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./sheriff_scanner
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same build again (served from cache, so it is fast), exported as a tar file
      # you can download and load onto the Pi without Docker on your laptop.
      - name: Export image as tarball
        uses: docker/build-push-action@v6
        with:
          context: ./sheriff_scanner
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/scanner.tar
          cache-from: type=gha

      - name: Compress tarball
        run: gzip -f /tmp/scanner.tar

      # Download this from the run's page in the Actions tab (Artifacts section).
      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: scanner-image
          path: /tmp/scanner.tar.gz
          compression-level: 0 # already gzipped
          retention-days: 14
