name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ] # Runs automatically every time you push code to your main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necessary to push to GitHub Container Registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sets up QEMU so GitHub can emulate ARM architecture for the Orange Pi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Sets up Docker Buildx for cross-compiling
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log into GitHub Container Registry (GHCR) using the built-in token
      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the image for ARM64 (Orange Pi) and push it
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64 # Target the Orange Pi's architecture explicitly
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/sheriff-scanner:latest
          cache-from: type=gha # Speeds up subsequent cloud builds drastically
          cache-to: type=gha,mode=max
